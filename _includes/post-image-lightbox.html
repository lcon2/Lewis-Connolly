<div class="post-image-lightbox" data-post-lightbox hidden>
  <div class="post-image-lightbox__backdrop" data-post-lightbox-close></div>
  <div class="post-image-lightbox__panel" role="dialog" aria-modal="true" aria-labelledby="post-image-lightbox-title">
    <button class="post-image-lightbox__close" type="button" aria-label="Close enlarged image" data-post-lightbox-close>&times;</button>
    <h2 id="post-image-lightbox-title" class="visually-hidden">Expanded image</h2>
    <figure class="post-image-lightbox__figure">
      <img src="" alt="" data-post-lightbox-image>
      <figcaption class="post-image-lightbox__caption" data-post-lightbox-caption></figcaption>
    </figure>
  </div>
</div>
